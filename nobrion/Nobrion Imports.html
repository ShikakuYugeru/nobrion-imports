/* Conceito: vitrine preta com o leão dourado no alto e prateleiras brancas de marketplace por baixo. Preto, branco e dourado, nada além disso. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f5f4f1;
  --surface-3: #ebe9e3;
  --ink: #111113;
  --ink-2: #44444a;
  --muted: #6a6a72;
  --line: #e4e2dc;
  --line-2: #cbc8bf;
  --bar: #0b0b0d;
  --bar-2: #141417;
  --bar-ink: #f6f1e3;
  --bar-muted: #aaa699;
  --gold: #c9a24b;
  --gold-2: #e4c36f;
  --gold-ink: #77590f;
  --gold-bg: rgba(201, 162, 75, 0.15);
  --on-gold: #17130a;
  --btn-bg: #111113;
  --btn-fg: #ffffff;
  --ok: #17794a;
  --ok-bg: #e5f3eb;
  --warn: #85560a;
  --warn-bg: #fbf1d9;
  --crit: #b3261e;
  --crit-bg: #fbe8e6;
  --info: #285a98;
  --info-bg: #e8f0fa;
  --img-bg: #f1f0ec;
  --focus: #77590f;
  --shadow: 0 1px 2px rgba(17, 17, 19, 0.06), 0 10px 28px rgba(17, 17, 19, 0.08);
  --f-display: 'Bodoni Moda', 'Didot', 'Bodoni 72', 'Playfair Display', Georgia, serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0e; --surface: #131316; --surface-2: #1a1a1e; --surface-3: #25252a;
    --ink: #f3f0e8; --ink-2: #cdcabf; --muted: #9d9a91; --line: #2a2a2f; --line-2: #3b3b41;
    --bar: #060607; --bar-2: #101012; --bar-ink: #f6f1e3; --bar-muted: #aaa699;
    --gold: #d4af5a; --gold-2: #ecc977; --gold-ink: #e3c26f; --gold-bg: rgba(212, 175, 90, 0.16); --on-gold: #17130a;
    --btn-bg: #2b2b31; --btn-fg: #f3f0e8;
    --ok: #4cc38a; --ok-bg: #12271c; --warn: #e3b24f; --warn-bg: #2b2210; --crit: #ff8074; --crit-bg: #2f1513; --info: #92b8ee; --info-bg: #14233b;
    --img-bg: #ecebe6; --focus: #ecc977; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0c0e; --surface: #131316; --surface-2: #1a1a1e; --surface-3: #25252a;
  --ink: #f3f0e8; --ink-2: #cdcabf; --muted: #9d9a91; --line: #2a2a2f; --line-2: #3b3b41;
  --bar: #060607; --bar-2: #101012; --bar-ink: #f6f1e3; --bar-muted: #aaa699;
  --gold: #d4af5a; --gold-2: #ecc977; --gold-ink: #e3c26f; --gold-bg: rgba(212, 175, 90, 0.16); --on-gold: #17130a;
  --btn-bg: #2b2b31; --btn-fg: #f3f0e8;
  --ok: #4cc38a; --ok-bg: #12271c; --warn: #e3b24f; --warn-bg: #2b2210; --crit: #ff8074; --crit-bg: #2f1513; --info: #92b8ee; --info-bg: #14233b;
  --img-bg: #ecebe6; --focus: #ecc977; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
body.no-scroll { overflow: hidden; }
img { max-width: 100%; }
a { color: inherit; }
h1, h2, h3, p { overflow-wrap: anywhere; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.hd, .ft, .hero, .drawer, .pubbar, .ann, .demo-bar, .ad-top, .toast { --focus: var(--gold-2); }
h1:focus { outline: none; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.ok-t { color: var(--ok); } .t-crit-t { color: var(--crit); } .t-warn-t { color: var(--warn); } .gold-t { color: var(--gold-ink); }
.crit { color: var(--crit); }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.05em; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.row-w { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 18px; min-width: 0; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-left: var(--gut); padding-right: var(--gutr); }
.page { padding-block: 28px 24px; min-width: 0; }
.narrow { max-width: 860px; }
@media (min-width: 901px) { .only-m { display: none !important; } }

/* ---------- botões e campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid transparent; font: 600 15px/1.1 var(--f-body); cursor: pointer; text-decoration: none; transition: background 0.15s, border-color 0.15s, color 0.15s; white-space: nowrap; color: var(--ink); background: transparent; }
.btn svg { flex: none; }
.btn-gold { background: var(--gold); color: var(--on-gold); }
.btn-gold:hover { background: var(--gold-2); }
.btn-dark { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn-dark:hover { border-color: var(--gold); }
.btn-line { border-color: var(--line-2); color: var(--ink); }
.btn-line:hover { border-color: var(--ink); }
.btn-line-light { border-color: rgba(246, 241, 227, 0.4); color: #f6f1e3; }
.btn-line-light:hover { border-color: var(--gold-2); color: var(--gold-2); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-crit { background: var(--crit); color: #fff; }
.btn-ghost.crit:hover { background: var(--crit-bg); }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn-lg { min-height: 52px; padding: 0 28px; font-size: 16px; }
.btn-block { width: 100%; }
.btn[disabled], .btn.is-disabled { opacity: 0.45; pointer-events: none; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: inherit; cursor: pointer; }
.link-btn { background: none; border: 0; padding: 0; color: var(--gold-ink); font: 600 13.5px var(--f-body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn.crit { color: var(--crit); }
.input, .select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; min-width: 0; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input::placeholder { color: var(--muted); opacity: 0.8; }
.input:hover, .select:hover { border-color: var(--ink-2); }
.input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--crit); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl, fieldset.field legend { font-weight: 600; font-size: 13.5px; }
small { font-weight: 400; color: var(--muted); }
.err { color: var(--crit); font-size: 13px; margin: 2px 0 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.fg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.span2 { grid-column: 1 / -1; }
@media (max-width: 560px) { .fg { grid-template-columns: 1fr; } }
.chk { display: flex; gap: 10px; align-items: center; cursor: pointer; padding: 6px 0; }
.chk input { width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.seg button { flex: 1; min-width: 150px; min-height: 48px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--ink); font: 600 14.5px var(--f-body); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.seg button.on { border-color: var(--gold); background: var(--gold-bg); box-shadow: inset 0 0 0 1px var(--gold); }
.seg em { font-style: normal; color: var(--ok); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2); font: 600 13px var(--f-body); cursor: pointer; color: var(--ink); }
.pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font: 700 12px/1.4 var(--f-body); white-space: nowrap; }
.pill.t-ok { background: var(--ok-bg); color: var(--ok); } .pill.t-warn { background: var(--warn-bg); color: var(--warn); } .pill.t-crit { background: var(--crit-bg); color: var(--crit); }
.pill.t-info { background: var(--info-bg); color: var(--info); } .pill.t-gold { background: var(--gold-bg); color: var(--gold-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.card h2 { font: 500 22px/1.2 var(--f-display); margin: 0 0 12px; }
.card h3 { font: 700 13px var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin: 20px 0 10px; }
.note, .co-note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--info-bg); color: var(--ink); font-size: 14px; margin: 0; }
.note svg, .co-note svg { flex: none; color: var(--info); margin-top: 2px; }
.co-note { background: var(--surface-2); } .co-note svg { color: var(--gold-ink); }

const blobCache = new Map(), blobBack = new Map();
function imgUrl(src) {
  if (!src) return '';
  if (src.startsWith('data:image/')) {
    if (!blobCache.has(src)) {
      try {
        const [h, b64] = src.split(',');
        const bin = atob(b64), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        const u = URL.createObjectURL(new Blob([u8], { type: /data:([^;]+)/.exec(h)[1] })); blobCache.set(src, u); blobBack.set(u, src);
      } catch (e) { blobCache.set(src, src); }
    }
    return blobCache.get(src);
  }
  return src;
}
const GENERIC_ART = { k: 'box', a: '#1b1b1e', b: '#c9a24b', c: '#c9a24b' };
function pImages(p) {

const byTs = (a, b) => String(b.ts).localeCompare(String(a.ts));
const stable = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((a, key) => { a[key] = x[key]; return a; }, {}) : x));
const ORD = {
  unsub: null, timer: 0, sig: '',
  async start() {
    S.ordersState = 'loading';
    const db = S.caps.db;
    if (!db) { this.list(LS.get('nob:adminOrders', [])); S.ordersState = 'ready'; this.seedExamples(); return; }
    let first = true;
    this.timer = setTimeout(() => { if (S.ordersState === 'loading') { S.ordersState = 'slow'; if (S.route.name.startsWith('admin')) render(); } }, 10000);
    try {
      this.unsub = db.collection('orders').onSnapshot((snap) => {
        clearTimeout(this.timer);
        const arr = snap.docs.map((d) => Object.assign({ id: d.id }, JSON.parse(JSON.stringify(d.data())))).sort(byTs);
        if (S.ordersState === 'ready' && stable(arr) === this.sig) return; // eco da nossa própria gravação: nada mudou na tela
        this.list(arr);
        S.ordersState = 'ready';
        if (first) { first = false; this.seedExamples(); }
        if (S.route.name.startsWith('admin') && !S.modal) render({ keep: true });
      }, () => { clearTimeout(this.timer); S.ordersState = 'error'; if (S.route.name.startsWith('admin')) render(); });
    } catch (e) { S.ordersState = 'error'; }
  },
  list(arr) { S.orders = arr.sort(byTs); this.sig = stable(S.orders); },
  async put(o) {
    const i = S.orders.findIndex((x) => x.id === o.id);
    if (i >= 0) S.orders[i] = o; else S.orders.unshift(o);
    this.list(S.orders);
    if (S.caps.db) { try { await S.caps.db.doc('orders/' + o.id).set(JSON.parse(JSON.stringify(o))); } catch (e) { toast('Não consegui salvar o pedido agora. Tente de novo.', 'crit'); } }
    else LS.set('nob:adminOrders', S.orders);
  },
  async del(id) {
    S.orders = S.orders.filter((x) => x.id !== id); this.sig = stable(S.orders);
    if (S.caps.db) { try { await S.caps.db.doc('orders/' + id).delete(); } catch (e) { /* ok */ } } else LS.set('nob:adminOrders', S.orders);
  },
  async seedExamples() {
    if (S.orders.length) return;
    const db = S.caps.db;
    if (db) { try { const m = await db.doc('meta/admin').get(); if (m.exists && m.data().seeded) return; } catch (e) { return; } }
    else if (LS.get('nob:exSeeded')) return;
    for (const o of makeExamples()) await this.put(o);
    if (db) { try { await db.doc('meta/admin').set({ seeded: true }); } catch (e) { /* ok */ } } else LS.set('nob:exSeeded', true);
    if (S.route.name.startsWith('admin')) render({ keep: true });
  },
};
function makeExamples() {
  const ps = S.data.products.filter((p) => p.active !== false);
  if (ps.length < 4) return [];
  const spec = [[0, 'entregue', 2, 11], [1, 'entregue', 1, 9], [2, 'enviado', 2, 6], [3, 'pago', 1, 4], [4, 'separacao', 3, 3], [5, 'aguardando', 1, 1], [6, 'pago', 2, 2], [7, 'entregue', 1, 7]];
  return spec.map(([i, status, qty, daysAgo], n) => {
    const p = ps[(i * 3) % ps.length], ts = new Date(Date.now() - daysAgo * 864e5 - n * 3.1e6).toISOString(), unit = priceInfo(S.data, p).price, sub = unit * qty;
    const pix = n % 2 === 0, pixOff = pix ? Math.round(sub * (S.data.store.pixDiscount || 0) / 100) : 0;
    return {
      id: 'EX' + String(n + 1).padStart(4, '0'), ts, status, hist: [{ s: 'aguardando', ts }], example: true,
      cust: { n: 'Cliente Exemplo ' + (n + 1), p: '63900000000', e: '', c: '' }, ship: { m: 'pickup', label: 'Retirar na loja' },
      items: [{ id: p.id, name: p.name, opts: [], qty, unit }], sub, coupon: null, pixOff, shipCost: 0, total: sub - pixOff,
      pay: { m: pix ? 'pix' : 'card', n: pix ? 1 : 2 }, track: status === 'enviado' ? 'EXEMPLO123BR' : '', note: '', via: 'site', stock: false, demo: true,
    };
  });
}
function setOrderStatus(o, status, track) {
  const n = JSON.parse(JSON.stringify(o));
  const prev = n.status;
  n.status = status;
  n.hist = (n.hist || []).concat({ s: status, ts: new Date().toISOString() });
  if (track != null) n.track = track;
  if (status === 'cancelado' && n.stock) { adjustStock(n, +1); n.stock = false; }
  else if (prev === 'cancelado' && status !== 'cancelado' && !n.stock && !n.example && !n.demo) { adjustStock(n, -1); n.stock = true; }
  ORD.put(n);
  return n;
}
function adjustStock(order, sign) {
  mutate((d) => {
    order.items.forEach((it) => { const p = d.products.find((x) => x.id === it.id); if (p) p.stock = Math.max(0, p.stock + sign * it.qty); });
  });
}

/* ---------- publicar: a página gera uma versão nova de si mesma ---------- */
const FALLBACK_RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function readReset() {
  try {
    for (const st of document.head.querySelectorAll('style')) {
      const t = st.textContent;
      if (/safe-area-inset-top/.test(t) && /\[hidden\]/.test(t)) return t;
    }
  } catch (e) { /* usa o padrão */ }
  return FALLBACK_RESET;
}
function readViewport() {
  try { const m = document.head.querySelector('meta[name="viewport"]'); if (m && m.content) return m.content; } catch (e) { /* ok */ }
  return 'width=device-width,initial-scale=1,viewport-fit=cover';
}
function buildDocument(data) {
  if (!SRC || !SRC.css || !SRC.js) throw new Error('fonte indisponível');
  const json = JSON.stringify(data).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="' + readViewport() + '"><style>' + readReset() + '</style></head><body>' +
    HEAD_HTML + '<style id="nob-css">' + SRC.css + '</style>' +
    '<div id="app"></div><div id="overlay"></div><div id="toasts" aria-live="polite"></div>' +
    '<script type="application/json" id="nob-data">' + json + '</' + 'script>' +
    '<script id="nob-js">' + SRC.js + '</' + 'script></body></html>';
}
async function publishNow() {
  const art = S.caps.artifact;
  if (!art) { toast('Publicar não está disponível nesta forma de abrir a loja. Abra o link logado na sua conta.', 'warn'); return; }
  if (S.publishing) return;
  const data = JSON.parse(JSON.stringify(S.draft || S.data));
  data.rev = (S.data.rev || 0) + 1;
  data.publishedAt = new Date().toISOString();
  data.tracking = buildTracking(S.orders);
  let html;
  try { html = buildDocument(data); } catch (e) { toast('Não consegui montar a página para publicar.', 'crit'); return; }
  if (html.length > 15.5 * 1024 * 1024) { toast('A página ficou grande demais. Remova algumas fotos ou produtos e tente de novo.', 'crit'); return; }
  S.publishing = true; render({ keep: true });
  SS.set('nob:after', { hash: location.hash || '#admin', ts: Date.now() });
  try {
    await art.publish(html);
    S.data = data; discardDraft();
    S.publishing = false; toast('Alterações publicadas. Os clientes já veem a loja atualizada.', 'ok'); render({ keep: true });
  } catch (e) {
    S.publishing = false; SS.del('nob:after');
    const c = e && e.code;
    const msg = c === 'conflict' ? 'Outra versão da loja foi publicada antes. A página vai recarregar; suas alterações ficam guardadas como rascunho.'
      : c === 'not_writer' || c === 'not_granted' ? 'Esta conta não pode publicar alterações nesta loja.'
      : c === 'too_large' ? 'A página ficou grande demais para publicar. Remova algumas fotos.'
      : c === 'rate_limited' ? 'Muitas publicações seguidas. Espere um minuto e tente de novo.'
      : 'Não consegui publicar agora. Suas alterações continuam salvas como rascunho. Tente de novo em instantes.';
    toast(msg, 'crit'); render({ keep: true });
  }
}

function applyFilters(base, useCat) {
  const f = S.ui.f, terms = norm(S.ui.q).split(/\s+/).filter(Boolean);
  let a = base;
  if (terms.length) a = a.filter((p) => { const hay = norm(`${p.name} ${p.desc} ${catOf(p.cat).name} ${p.sku || ''}`); return terms.every((t) => hay.includes(t)); });
  if (useCat && f.cat) a = a.filter((p) => p.cat === f.cat);
  const min = f.min ? parseMoney(f.min) : 0, max = f.max ? parseMoney(f.max) : 0;
  if (min) a = a.filter((p) => info(p).price >= min);
  if (max) a = a.filter((p) => info(p).price <= max);
  if (f.promo) a = a.filter((p) => info(p).pct > 0);
  if (f.stock) a = a.filter((p) => p.stock > 0);
  const by = {
    rel: (x, y) => (y.featured ? 1 : 0) - (x.featured ? 1 : 0) || String(y.createdAt).localeCompare(String(x.createdAt)),
    menor: (x, y) => info(x).price - info(y).price, maior: (x, y) => info(y).price - info(x).price,
    novos: (x, y) => String(y.createdAt).localeCompare(String(x.createdAt)), desc: (x, y) => info(y).pct - info(x).pct,
  }[f.sort] || null;
  return by ? a.slice().sort(by) : a;
}

function placeOrder() {
  const v = cartView({ pay: S.co.pay }), pr = S.profile, e = {}, home = S.co.ship === 'home';
  if (!v.lines.length || v.lines.some((l) => !l.avail)) e.cart = 'Há produtos esgotados no carrinho. Remova-os para continuar.';
  if (String(pr.n || '').trim().length < 3) e.n = 'Informe seu nome completo.';
  if (!validPhone(pr.p)) e.p = 'Informe um WhatsApp com DDD, por exemplo (63) 99999-9999.';
  if (pr.e && !validEmail(pr.e)) e.e = 'Esse e-mail não parece certo.';
  if (pr.c && !(validCPF(pr.c) || validCNPJ(pr.c))) e.c = 'CPF inválido. Confira os números ou deixe em branco.';
  if (home) {
    if (!validCep(pr.cep)) e.cep = 'Digite um CEP com 8 números.'; else if (!v.ship) e.cep = 'Ainda não entregamos neste CEP. Fale com a loja.';
    if (!String(pr.rua || '').trim()) e.rua = 'Informe a rua.';
    if (!String(pr.num || '').trim()) e.num = 'Informe o número.';
    if (!String(pr.bairro || '').trim()) e.bairro = 'Informe o bairro.';
    if (!String(pr.cidade || '').trim()) e.cidade = 'Informe a cidade.';
    if (!UFS.includes(pr.uf)) e.uf = 'Escolha o estado.';
  }
  if (Object.keys(e).length) {
    S.co.errors = e; render({ keep: true });
    const first = Object.keys(e).find((k) => k !== 'cart'), el = first && $('#c-' + first);
    if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center' }); } else window.scrollTo(0, 0);
    toast('Revise os campos marcados.', 'warn'); return;
  }
  const ts = new Date().toISOString(), id = newOrderId(), card = S.co.pay === 'card';
  const o = {
    id, ts, status: 'aguardando', hist: [{ s: 'aguardando', ts }],
    cust: { n: pr.n.trim(), p: digits(pr.p), e: String(pr.e || '').trim(), c: digits(pr.c) },
    ship: home ? { m: 'home', cep: digits(pr.cep), rua: pr.rua.trim(), num: pr.num.trim(), comp: String(pr.comp || '').trim(), bairro: pr.bairro.trim(), cidade: pr.cidade.trim(), uf: pr.uf, region: v.ship.region, label: v.ship.label } : { m: 'pickup', label: 'Retirar na loja' },
    items: v.lines.map((l) => ({ id: l.p.id, name: l.p.name, opts: l.opts, qty: l.qty, unit: l.unit })),
    sub: v.subtotal, coupon: v.coupon.ok ? { code: v.coupon.code, off: v.off } : null, pixOff: v.pixOff, shipCost: v.ship ? v.ship.price : 0, total: v.total,
    pay: { m: S.co.pay, n: card ? clamp(S.co.inst, 1, instMax(D(), v.total)) : 1 }, track: '', note: '', via: 'site', stock: false, demo: demoMode(), mode: demoMode() ? 'demo' : 'open',
  };
  S.myOrders = [o].concat(S.myOrders).slice(0, 40); LS.set('nob:myorders', S.myOrders);
  S.cart = []; saveCart(); S.coupon = ''; LS.set('nob:coupon', ''); S.co.errors = {}; updateBadges();
  go('#pedido-' + id);
}

/* ---------- pedido: pagamento e envio ---------- */

}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 4 ? 4 : f <= 5 ? 5 : f <= 8 ? 8 : 10) * p; }
function salesSeries(n) {

  days.forEach((d) => { map[dayKey(d)] = 0; });

function chartSvg(series) {
  const W = 680, H = 240, L = 62, R = 14, T = 22, B = 34, pw = W - L - R, ph = H - T - B;
  const peak = Math.max(...series.map((s) => s.v)), max = niceMax(Math.max(peak, 1000)), bw = pw / series.length, bar = Math.min(30, bw * 0.6);
  const y = (v) => T + ph - (v / max) * ph;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = (max / 4) * i; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="cg"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" class="ct">${brlShort(Math.round(v))}</text>`; }
  const last = series.length - 1, hi = series.findIndex((s) => s.v === peak);
  const bars = series.map((s, i) => {
    const x = L + i * bw + (bw - bar) / 2, h = Math.max(s.v > 0 ? 2 : 0, (s.v / max) * ph);
    const lab = (i % 2 === last % 2) ? `<text x="${x + bar / 2}" y="${H - 12}" text-anchor="middle" class="ct">${String(s.d.getDate()).padStart(2, '0')}/${String(s.d.getMonth() + 1).padStart(2, '0')}</text>` : '';
    const val = peak > 0 && (i === hi || i === last) && s.v > 0 ? `<text x="${x + bar / 2}" y="${y(s.v) - 6}" text-anchor="middle" class="cv">${brlShort(s.v)}</text>` : '';
    return `<rect x="${x}" y="${T + ph - h}" width="${bar}" height="${h}" rx="3" class="${i === last ? 'cb cb-now' : 'cb'}"/>${lab}${val}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Vendas dos últimos ${series.length} dias. Total ${brl(series.reduce((a, s) => a + s.v, 0))}.">${g}${bars}</svg>`;
}

async function readImage(file) {
  const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const sc = Math.min(1, 1000 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
  let out = cv.toDataURL('image/webp', 0.82);
  if (!out.startsWith('data:image/webp')) out = cv.toDataURL('image/jpeg', 0.85);
  return out;
}

function applyCfg(el, commit) {
  const k = el.dataset.k, t = el.dataset.t || 'str';
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (t === 'money') { if (!commit) return; v = parseMoney(el.value); }
  else if (t === 'int') { if (!commit && el.value === '') return; v = Math.max(0, parseInt(el.value, 10) || 0); if (/pixDiscount/.test(k)) v = Math.min(v, 90); if (/maxInstallments/.test(k)) v = clamp(v, 1, 12); }
  else { v = el.value; if (el.dataset.mask === 'phone') { v = maskPhone(v); if (v !== el.value) el.value = v; } }
  mutate((d) => setPath(d, k, v));
  if (commit && t === 'money') el.value = brlPlain(v);
  if (/pix\.(key|type|name|city)/.test(k)) { const s = $('#pix-status'); if (s) s.innerHTML = pixStatusHtml(); S.ui.modeErr = []; }
  updatePub();
}

/* app.js: rotas, desenho da página, eventos e inicialização */
const SRC = { css: (document.getElementById('nob-css') || {}).textContent || '', js: (document.getElementById('nob-js') || {}).textContent || '' };
const HEAD_HTML = "<title>Nobrion Imports<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Figtree:wght@400;500;600;700&display=swap\">\n";

function parseRoute(h) {
  const s = String(h || '').replace(/^#/, '') || 'inicio';
  const a = /^admin(?:-(pedidos|pedido|produtos|produto|promocoes|clientes|config))?(?:-(.+))?$/.exec(s);
  if (a) return { name: 'admin' + (a[1] ? '-' + a[1] : ''), arg: a[2] || '' };
  const i = s.indexOf('-'), base = i < 0 ? s : s.slice(0, i), arg = i < 0 ? '' : s.slice(i + 1);
  if (['cat', 'produto', 'pedido', 'ajuda'].includes(base)) return { name: base, arg };
  return { name: s, arg: '' };
}
const LIST_ROUTES = ['produtos', 'cat', 'ofertas'];
const DEF_FILTERS = () => ({ cat: '', min: '', max: '', promo: false, stock: false, sort: 'rel' });
function route() {
  const prev = S.route, next = parseRoute(location.hash), n = next.name;
  S.route = next;
  S.ui.navOpen = false; S.ui.filtersOpen = false;
  if (S.modal) closeModal();
  if (!(n === 'produtos' && S.ui.keepQ)) S.ui.q = '';
  S.ui.keepQ = false;
  if (LIST_ROUTES.includes(n) && (prev.name !== n || prev.arg !== next.arg)) S.ui.f = DEF_FILTERS();
  if (n === 'produto') { S.ui.qty = 1; S.ui.gi = 0; S.ui.selErr = ''; if (prod(next.arg)) pushRecent(next.arg); }
  if (n !== 'admin-produto') { S.ui.pf = null; S.ui.pfErr = {}; }
  if (n !== 'pagamento') S.co.errors = {};
  render({ top: true });
}

function view() {
  const r = S.route, n = r.name;
  if (n.startsWith('admin')) {
    if (!S.admin) return shopHeader() + `<main id="main">${adminGate()}</main>` + shopFooter();
    const pages = {
      admin: adminHome, 'admin-pedidos': adminOrders, 'admin-pedido': () => adminOrder(r.arg), 'admin-produtos': adminProducts, 'admin-produto': () => adminProductForm(r.arg),
      'admin-promocoes': adminPromos, 'admin-clientes': adminClients, 'admin-config': adminConfig,
    };
    return adminShell((pages[n] || adminHome)());
  }
  const pages = {
    inicio: pageHome, produtos: pageList, cat: pageList, ofertas: pageList, produto: () => pageProduct(r.arg), favoritos: pageFavs, carrinho: pageCart, pagamento: pageCheckout,
    pedido: () => pageOrder(r.arg), pedidos: pageOrders, ajuda: pageHelp,
  };
  return shopHeader() + `<main id="main">${(pages[n] || notFound)()}</main>` + shopFooter();
}
function render(opt) {
  opt = opt || {};
  const app = $('#app');
  if (!app) return;
  const sy = window.scrollY, ae = document.activeElement, aid = ae && ae.id;
  let html;
  try { html = view(); } catch (e) { if (window.console) console.error(e); html = `<div class="wrap page">${emptyState('alert', 'Não consegui montar esta página', 'Atualize a página. Se continuar, volte ao início.', '<a class="btn btn-dark" href="#inicio">Voltar ao início</a>')}</div>`; }
  app.innerHTML = html + `<div id="pub">${publishBar()}</div>`;
  updateBadges();
  if (opt.top) {
    const t = $('[data-scroll]'), target = t && document.getElementById(t.dataset.scroll);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
    const h = $('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  } else if (opt.keep) {
    window.scrollTo(0, sy);
    if (aid && !S.modal) { const n = document.getElementById(aid); if (n && n !== document.activeElement) { try { n.focus({ preventScroll: true }); } catch (e) { /* ok */ } } }
  }
}

/* ---------- eventos ---------- */
document.addEventListener('click', (ev) => {
  let el = ev.target.closest('[data-act]');
  while (el && el.hasAttribute('data-self') && ev.target !== el) el = el.parentElement ? el.parentElement.closest('[data-act]') : null;
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'A') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('input', (ev) => { const el = ev.target.closest && ev.target.closest('[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el, ev); });
document.addEventListener('change', (ev) => { const el = ev.target.closest && ev.target.closest('[data-ch]'); if (el && CHG[el.dataset.ch]) CHG[el.dataset.ch](el, ev); });
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest && ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  if (FORM[f.dataset.form]) FORM[f.dataset.form](f, ev);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { if (S.modal) closeModal(); else if (S.ui.navOpen) { S.ui.navOpen = false; render({ keep: true }); } return; }
  if (ev.key === 'Tab' && S.modal) {
    const f = $$('#overlay a[href], #overlay button:not([disabled]), #overlay input:not([disabled]), #overlay select, #overlay textarea');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); } else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});
document.addEventListener('error', (ev) => {
  const t = ev.target;
  if (t && t.tagName === 'IMG' && !t.dataset.fb) { const o = blobBack.get(t.src); if (o) { t.dataset.fb = '1'; t.src = o; } }
}, true);
window.addEventListener('hashchange', route);

/* ---------- dados e inicialização ---------- */
function normalizeData(d) {
  const def = NOB_SEED(new Date());
  d.store = Object.assign({}, def.store, d.store || {});
  d.store.shipping = Object.assign({}, def.store.shipping, d.store.shipping || {});
  d.store.pickup = Object.assign({}, def.store.pickup, d.store.pickup || {});
  d.store.pix = Object.assign({}, def.store.pix, d.store.pix || {});
  d.store.card = Object.assign({}, def.store.card, d.store.card || {});
  ['categories', 'products', 'promos', 'coupons'].forEach((k) => { if (!Array.isArray(d[k])) d[k] = []; });
  if (!d.tracking || typeof d.tracking !== 'object') d.tracking = {};
  d.rev = d.rev || 1;
  return d;
}
function restoreDraft() {
  const dr = LS.get('nob:draft');
  if (!dr || !dr.content) return;
  if (dr.base === S.data.rev) { S.draft = normalizeData(dr.content); S.dirty = true; } else S.stale = dr;
}
async function initCaps() {
  const [user, art, dl, db] = await Promise.all([useCap('user'), useCap('artifact'), useCap('downloads'), useCap('db')]);
  S.caps = { user, artifact: art, downloads: dl, db };
  let admin = false;
  if (user) { try { admin = !!(await withTimeout(user.canEdit(), 4000)); } catch (e) { admin = false; } }
  S.admin = admin; S.adminKnown = true;
  if (admin) { restoreDraft(); ORD.start(); }
  render({ keep: true });
}
function boot() {
  try { S.data = normalizeData(JSON.parse(document.getElementById('nob-data').textContent)); }
  catch (e) { $('#app').innerHTML = '<div class="wrap page"><h1>Não consegui abrir a loja</h1><p>Atualize a página.</p></div>'; return; }
  const after = SS.get('nob:after');
  if (after) {
    SS.del('nob:after');
    if (Date.now() - after.ts < 120000) { if (after.hash && location.hash !== after.hash) { try { history.replaceState(null, '', after.hash); } catch (e) { location.hash = after.hash; } } setTimeout(() => toast('Alterações publicadas. Os clientes já veem a loja atualizada.', 'ok'), 700); }
  }
  route();
  initCaps();
}
boot();
</script>
</body></html>
